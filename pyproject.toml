[project]
name = "orchestra"
version = "0.1.0"
description = "Orchestration d'agents LLM locaux, exposes a Claude Code via MCP"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6.0", "mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
orchestra = "orchestra.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["orchestra*"]
